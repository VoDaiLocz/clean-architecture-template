<div class="p-6 h-screen flex flex-col bg-white">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Source Inventory</h1>
  </div>

  <div class="flex-1 flex gap-4 overflow-x-auto">
    <div *ngFor="let col of columns" class="flex-1 min-w-[250px] bg-gray-50 rounded-lg p-4 flex flex-col">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-medium text-gray-700">{{ col.title }} ({{ getItemsByStatus(col.status).length }})</h2>
      </div>

      <div class="flex-1 flex flex-col gap-3 overflow-y-auto">
        <div *ngFor="let item of getItemsByStatus(col.status)" 
             class="bg-white p-4 rounded-md shadow-sm border border-gray-200 cursor-grab active:cursor-grabbing">
          <div class="text-sm text-gray-500 mb-1">#{{ item.id }}</div>
          <h3 class="font-medium text-gray-900 mb-4">{{ item.title }}</h3>
          
          <div class="flex justify-end">
            <button class="text-sm text-blue-600 font-medium hover:text-blue-800 transition-colors">
              {{ getActionText(item.status) }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
