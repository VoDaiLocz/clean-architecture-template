<div class="h-screen flex flex-col bg-slate-50 font-sans text-slate-800">
  <!-- Top Header -->
  <header class="bg-blue-800 text-white p-4 flex justify-between items-center shadow-md z-10 sticky top-0">
    <div class="flex items-center gap-4">
      <h1 class="text-xl font-bold tracking-wide">TOEIC Practice Test</h1>
      <span class="bg-blue-700 px-3 py-1 rounded text-sm font-medium">Session: demo-exam</span>
    </div>
    
    <div class="flex items-center gap-6">
      <div class="flex items-center gap-2 text-xl font-mono bg-slate-900 px-4 py-2 rounded shadow-inner">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span [class.text-red-400]="timeRemaining < 300">{{ timerDisplay }}</span>
      </div>
      <button 
        (click)="submitExam()"
        class="bg-blue-500 hover:bg-blue-400 text-white px-6 py-2 rounded font-semibold transition-colors shadow-sm">
        Submit Test
      </button>
    </div>
  </header>

  <!-- Main Content Area -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Left Sidebar (Question Palette) -->
    <aside class="w-72 bg-white border-r border-slate-200 flex flex-col shadow-sm z-0">
      <div class="p-4 border-b border-slate-200 bg-slate-50">
        <h2 class="font-semibold text-slate-700">Question Palette</h2>
        <div class="flex items-center gap-4 mt-2 text-sm text-slate-500">
          <div class="flex items-center gap-1"><div class="w-3 h-3 bg-blue-100 border border-blue-300"></div> Answered</div>
          <div class="flex items-center gap-1"><div class="w-3 h-3 bg-white border border-slate-300"></div> Unanswered</div>
        </div>
      </div>
      <div class="flex-1 overflow-y-auto p-4">
        <div class="grid grid-cols-5 gap-2">
          <button 
            *ngFor="let q of questions; let i = index"
            (click)="goToQuestion(i)"
            [ngClass]="{
              'bg-blue-600 text-white border-blue-700': currentIndex === i,
              'bg-blue-100 border-blue-300 text-blue-900': answers[q.number] && currentIndex !== i,
              'bg-white border-slate-300 hover:bg-slate-50': !answers[q.number] && currentIndex !== i
            }"
            class="w-10 h-10 flex items-center justify-center border rounded text-sm font-medium transition-colors">
            {{ q.number }}
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Question Area -->
    <main class="flex-1 overflow-y-auto bg-slate-100 p-8">
      <div class="max-w-4xl mx-auto" *ngIf="currentQuestion">
        
        <!-- Passage Section (if applicable) -->
        <div *ngIf="currentQuestion.passage" class="bg-white rounded-lg shadow-sm border border-slate-200 p-6 mb-6">
          <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3 border-b pb-2">Reading Passage</h3>
          <div class="prose prose-slate max-w-none text-slate-700 leading-relaxed">
            {{ currentQuestion.passage }}
          </div>
        </div>

        <!-- Question Section -->
        <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
          <div class="bg-blue-50 border-b border-blue-100 p-6">
            <h2 class="text-xl font-medium text-slate-800 flex gap-3">
              <span class="text-blue-600 font-bold min-w-[2.5rem]">Q{{ currentQuestion.number }}.</span>
              <span>{{ currentQuestion.text }}</span>
            </h2>
          </div>
          
          <!-- Answer Options -->
          <div class="p-6">
            <div class="flex flex-col gap-3">
              <label *ngFor="let opt of currentQuestion.options; let optIdx = index"
                class="flex items-center p-4 border rounded-lg cursor-pointer transition-all hover:bg-blue-50 hover:border-blue-200 group"
                [class.bg-blue-50]="isOptionSelected(optIdx)"
                [class.border-blue-400]="isOptionSelected(optIdx)"
                [class.border-slate-200]="!isOptionSelected(optIdx)">
                
                <input 
                  type="radio" 
                  [name]="'question_' + currentQuestion.number" 
                  [checked]="isOptionSelected(optIdx)"
                  (change)="selectOption(optIdx)"
                  class="w-5 h-5 text-blue-600 focus:ring-blue-500 border-slate-300">
                
                <span class="ml-4 flex items-center gap-3">
                  <span class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 text-slate-500 font-medium group-hover:bg-blue-100 group-hover:text-blue-700"
                        [class.bg-blue-600]="isOptionSelected(optIdx)"
                        [class.text-white]="isOptionSelected(optIdx)">
                    {{ ['A', 'B', 'C', 'D'][optIdx] }}
                  </span>
                  <span class="text-slate-700 font-medium">{{ opt }}</span>
                </span>
              </label>
            </div>
          </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="flex justify-between items-center mt-8">
          <button 
            (click)="prevQuestion()" 
            [disabled]="currentIndex === 0"
            class="px-6 py-3 bg-white border border-slate-300 text-slate-700 rounded shadow-sm hover:bg-slate-50 hover:text-blue-600 disabled:opacity-50 disabled:cursor-not-allowed font-medium transition-colors flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
            </svg>
            Previous
          </button>
          
          <div class="text-slate-500 font-medium bg-white px-4 py-2 border border-slate-200 rounded shadow-sm">
            {{ currentIndex + 1 }} / {{ questions.length }}
          </div>

          <button 
            (click)="nextQuestion()" 
            [disabled]="currentIndex === questions.length - 1"
            class="px-6 py-3 bg-blue-600 text-white rounded shadow-sm hover:bg-blue-500 disabled:opacity-50 disabled:cursor-not-allowed font-medium transition-colors flex items-center gap-2">
            Next
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
            </svg>
          </button>
        </div>

      </div>
    </main>
  </div>
</div>
