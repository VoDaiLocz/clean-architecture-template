<div class="min-h-screen bg-blue-50 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-blue-100">
    <!-- Header decoration -->
    <div class="h-32 bg-gradient-to-r from-blue-400 to-cyan-500 relative">
      <div class="absolute inset-0 bg-white/20" style="clip-path: polygon(0 80%, 100% 20%, 100% 100%, 0% 100%);"></div>
    </div>
    
    <div class="px-8 pb-8 pt-6 -mt-12 text-center relative z-10">
      <div class="w-24 h-24 mx-auto bg-white rounded-full flex items-center justify-center shadow-lg border-4 border-blue-50 mb-6">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-cyan-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
        </svg>
      </div>

      <h2 class="text-3xl font-bold text-slate-800 mb-2">Great Job!</h2>
      <p class="text-slate-600 mb-6">You've completed the placement test.</p>
      
      <div class="bg-blue-50/50 rounded-xl p-6 mb-8 border border-blue-100">
        <p class="text-sm font-medium text-slate-500 uppercase tracking-wider mb-2">Your Estimated Level</p>
        <div class="text-5xl font-extrabold text-blue-600 tracking-tight">
          {{ score }}
        </div>
        <p class="text-blue-500 font-medium mt-1">TOEIC&reg;</p>
      </div>

      <button 
        (click)="generatePath()" 
        [disabled]="isGenerating"
        class="w-full bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-600 hover:to-cyan-600 text-white font-semibold py-4 px-6 rounded-xl shadow-md transition-all transform hover:-translate-y-0.5 disabled:opacity-70 disabled:cursor-not-allowed disabled:transform-none flex justify-center items-center gap-2">
        <span *ngIf="isGenerating" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
        {{ isGenerating ? 'Generating...' : 'Generate My Learning Path' }}
      </button>
    </div>
  </div>
</div>
