name: backend-quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore backend/ToeicSystem.sln

      - name: Build
        run: dotnet build backend/ToeicSystem.sln --no-restore

      - name: Application tests
        run: dotnet run --project backend/tests/Application.UnitTest/Application.UnitTest.csproj --no-build
